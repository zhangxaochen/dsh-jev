name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # Release.yml calls this instead of restating the gates: a tag can point at a
  # commit no branch push ever verified, and the published tarball is the one
  # artifact that cannot be taken back.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares ^22.19.0 || >=24.0.0
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # pnpm test's pretest already runs this; the explicit step keeps the failure
      # attributable and visible in the job summary.
      # lib/ is committed and the suite imports it, so a source edit without a
      # rebuild would otherwise pass here while the repository ships old code.
      - name: Build output matches the committed build
        run: pnpm run verify:build

      - name: Type-check the tooling (bench, tests, scripts)
        run: pnpm run typecheck:scripts

      - name: Unit tests
        run: pnpm test

      # The offline bench replays recorded answers (with a fingerprint check that
      # the case input still matches the recording), so it needs no API key. It
      # fails the job on any case that does not behave as labelled, except the
      # documented known misses.
      - name: Calibration bench (offline)
        run: pnpm run bench:offline

      # No DSH runtime exists on a runner, so this exercises the skip path: it
      # must report SKIP and exit 0 rather than fail. Behaviour against a real
      # runtime is covered by running this on a machine with DSH installed.
      # Packs the tarball, installs it into a scratch directory and imports it by
      # package name: the only check that proves a published install resolves.
      - name: Published artifact installs and resolves
        run: pnpm run verify:pack

      - name: DSH integration checks (skip when no runtime)
        run: pnpm run verify:dsh

      # The packed tarball is asserted by tests/packaging.spec.ts, which runs in the
      # unit step above and checks more: the patch file the host loads, every built
      # module, and that no development file ships.
