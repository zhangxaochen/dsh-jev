name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares ^22.19.0 || >=24.0.0
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # pnpm test's pretest already runs this; the explicit step keeps the failure
      # attributable and visible in the job summary.
      - name: Type-check the tooling (bench, tests, scripts)
        run: pnpm run typecheck:scripts

      - name: Unit tests
        run: pnpm test

      # The offline bench replays recorded answers, so it needs no API key and
      # fails the job on any false positive or an accuracy drop below 0.9.
      - name: Calibration bench (offline)
        run: pnpm run bench:offline

      # No DSH runtime exists on a runner, so this exercises the skip path: it
      # must report SKIP and exit 0 rather than fail. Behaviour against a real
      # runtime is covered by running this on a machine with DSH installed.
      - name: DSH integration checks (skip when no runtime)
        run: pnpm run verify:dsh

      - name: Packed contents include every built module
        run: |
          node -e "
          const { execSync } = require('node:child_process');
          const files = JSON.parse(execSync('npm pack --dry-run --json', { encoding: 'utf8' }))[0].files.map((f) => f.path);
          const required = ['lib/index.js','lib/loop-guard.js','lib/safety-guard.js','lib/metrics.js','lib/decisions.js','lib/ask-tools.js','lib/skill-router.js','lib/result-shaper.js','lib/bench-summary.js'];
          const missing = required.filter((p) => !files.includes(p));
          if (missing.length > 0) { console.error('missing from package: ' + missing.join(', ')); process.exit(1); }
          console.log('packed files: ' + files.length);
          "
