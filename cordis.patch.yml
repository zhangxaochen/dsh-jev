# DeepSeek Harness official bundle layer for dsh-jev
- insert:
    - id: dsh-jev
      name: dsh-jev
      config:
        client:
          apiKey: !!js process.env.TYPESAFE_API_KEY
        loopGuard:
          triggerThreshold: 2
          noProgressThreshold: 0.3
          pLoopThreshold: 0.6
          minConfidence: 0.5
          cooldownSteps: 3
          maxHistory: 8
          deferExactRepeats: true
        safetyGuard:
          blockThreshold: 0.85
          askApprovalThreshold: 0.5
          onError: deny-guarded
          onUncertain: deny-guarded
          guardedTools:
            - bash
            - pwsh
            - terminal
            - run_command
            - execute_command
            - run_code
            - write_to_file
            - replace_file_content
        toolPruner:
          maxTools: 8
          minScoreThreshold: 2
          alwaysRetain:
            - read_file
            - write_to_file
            - write_file
            - edit_file
            - str_replace_editor
            - bash
            - terminal
            - pwsh
            - run_command
            - execute_command
            - grep
            - glob
            - find_by_name
            - view_file
            - replace_file_content
            - list_dir
            - directory-picker-native
            - ui-directory-picker-native
