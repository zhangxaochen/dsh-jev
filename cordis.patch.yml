# DeepSeek Harness official bundle layer for dsh-jev
- insert:
    - id: dsh-jev
      name: dsh-jev
      config:
        client:
          apiKey: !!js process.env.TYPESAFE_API_KEY
        loopGuard:
          triggerThreshold: 2
          noProgressThreshold: 0.3
          pLoopThreshold: 0.6
          minConfidence: 0.5
          cooldownSteps: 3
          maxHistory: 8
          deferExactRepeats: true
        safetyGuard:
          blockThreshold: 0.85
          askApprovalThreshold: 0.5
          # kept in step with DEFAULT_ON_ERROR: an unreachable judge allows the call,
          # is counted as an inspectionFailure, and the deterministic envelope still denies
          # the unambiguous cases. Pin 'deny-guarded' here for a stricter deployment.
          onError: allow
          onUncertain: deny-guarded
          # The inspection is a blocking dependency of every guarded call, so it gets its
          # own budget rather than the 800ms advisory one: measured inspections run 1.2-1.4s,
          # which made the old budget fail outright. One bounded retry covers a slow call.
          inspectionTimeoutMs: 3500
          inspectionRetries: 1
          guardedTools:
            - bash
            - pwsh
            - terminal
            - run_command
            - execute_command
            - run_code
            - write_to_file
            - replace_file_content
        toolPruner:
          maxTools: 8
          minScoreThreshold: 2
          alwaysRetain:
            - read_file
            - write_to_file
            - write_file
            - edit_file
            - str_replace_editor
            - bash
            - terminal
            - pwsh
            - run_command
            - execute_command
            - grep
            - glob
            - find_by_name
            - view_file
            - replace_file_content
            - list_dir
            - directory-picker-native
            - ui-directory-picker-native
